<!DOCTYPE html>
<html>
<head>
<title>Robux</title>
<style>
body {
  font-family sans-serif
  background-color #191919
  color white
  display flex
  justify-content center
  align-items center
  height 100vh
  margin 0
}
.card {
  background-color #232527
  padding 20px
  border-radius 8px
  width 300px
  text-align center
}
input select button {
  width 100%
  padding 10px
  margin 10px 0
  border-radius 4px
  border none
}
button {
  background-color #00a2ff
  color white
  font-weight bold
  cursor pointer
}
</style>
</head>
<body>

<div class="card">
  <h2>Robux Al</h2>
  <form>
    <label>Kullanici Adi</label>
    <input type="text" placeholder="Adinizi girin">
    
    <label>Robux Miktari</label>
    <select>
      <option value="400">400 Robux</option>
      <option value="800">800 Robux</option>
      <option value="1700">1700 Robux</option>
      <option value="4500">4500 Robux</option>
      <option value="10000">10000 Robux</option>
    </select>
    
    <button type="button">Devam Et</button>
  </form>
</div>

</body>
</html>
