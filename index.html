<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Robux Kataloğu</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0a1128;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
    }

    .catalog-card {
      background-color: #1c2541;
      padding: 30px;
      border-radius: 12px;
      width: 350px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      text-align: center;
      border: 1px solid #3a506b;
    }

    .catalog-card h2 {
      margin-bottom: 20px;
      font-size: 24px;
      color: #4cc9f0;
    }

    .form-group {
      margin-bottom: 18px;
      text-align: left;
    }

    .form-group label {
      display: block;
      margin-bottom: 6px;
      font-size: 14px;
      color: #cbd5e1;
    }

    .form-group input,
    .form-group select {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #3a506b;
      background-color: #0b132b;
      color: #ffffff;
      font-size: 15px;
      outline: none;
    }

    .btn-submit {
      width: 100%;
      padding: 12px;
      border-radius: 6px;
      border: none;
      background-color: #4361ee;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      margin-top: 10px;
    }

    .btn-submit:hover {
      background-color: #3a0ca3;
    }

    /* Yükleme ekranı ve çark animasyonu */
    .spinner {
      border: 4px solid rgba(255, 255, 255, 0.1);
      border-left-color: #4cc9f0;
      border-radius: 50%;
      width: 50px;
      height: 50px;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Gizleme sınıfları */
    .hidden {
      display: none;
    }

    .success-icon {
      font-size: 48px;
      color: #4ef037;
      margin-bottom: 10px;
    }
  </style>
</head>
<body>

  <!-- Ana Form Ekranı -->
  <div id="form-screen" class="catalog-card">
    <h2>Robux Kataloğu</h2>
    <form id="robux-form">
      <div class="form-group">
        <label for="username">Kullanıcı Adı</label>
        <input type="text" id="username" placeholder="Kullanıcı adınızı girin" required>
      </div>
      
      <div class="form-group">
        <label for="robux-amount">Robux Miktarı</label>
        <select id="robux-amount">
          <option value="400">400 Robux</option>
          <option value="800">800 Robux</option>
          <option value="1700">1,700 Robux</option>
          <option value="4500">4,500 Robux</option>
          <option value="10000">10,000 Robux</option>
        </select>
      </div>
      
      <button type="submit" class="btn-submit">Devam Et</button>
    </form>
  </div>

  <!-- Yükleniyor Ekranı -->
  <div id="loading-screen" class="catalog-card hidden">
    <h2>Robux Gönderiliyor</h2>
    <div class="spinner"></div>
    <p style="color: #cbd5e1;">Lütfen bekleyin...</p>
  </div>

  <!-- Başarılı Ekranı -->
  <div id="success-screen" class="catalog-card hidden">
    <div class="success-icon">✓</div>
    <h2>Başarılı!</h2>
    <p style="color: #cbd5e1; margin-bottom: 20px;">Robux başarılı şekilde gönderildi</p>
    <button type="button" class="btn-submit" onclick="resetForm()">Ana Ekrana Dön</button>
  </div>

  <script>
    const formScreen = document.getElementById('form-screen');
    const loadingScreen = document.getElementById('loading-screen');
    const successScreen = document.getElementById('success-screen');
    const robuxForm = document.getElementById('robux-form');

    robuxForm.addEventListener('submit', function(e) {
      e.preventDefault();
      
      // Form ekranını gizle, yükleme ekranını göster
      formScreen.classList.add('hidden');
      loadingScreen.classList.remove('hidden');

      // 3 saniye çark döndükten sonra başarılı ekranını göster
      setTimeout(() => {
        loadingScreen.classList.add('hidden');
        successScreen.classList.remove('hidden');
      }, 3000);
    });

    function resetForm() {
      // Başarılı ekranı gizle, formu sıfırla ve ana ekranı göster
      successScreen.classList.add('hidden');
      robuxForm.reset();
      formScreen.classList.remove('hidden');
    }
  </script>

</body>
  </html>
